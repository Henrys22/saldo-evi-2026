name: Verificar Docker Compose

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probar arranque, persistencia y recuperación
        run: bash scripts/verificar-compose.sh
