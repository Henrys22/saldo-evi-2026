name: Verificar Docker Compose

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Probar arranque, persistencia y recuperación
        run: bash scripts/verificar-compose.sh
